plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group_id
version = mod_version
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '**/.cache/**'

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = '2024.11.17'
    }
    runs {
        client {
            client()
            gameDirectory = file('run-client')
            jvmArgument "-Db2spirit.b2.modelExport=${file('art/b2-spirit.obj').absolutePath}"
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods {
        b2spirit { sourceSet sourceSets.main }
    }
}

dependencyLocking {
    lockAllConfigurations()
    // Minecraft selects the native epoll transport by OS. Its version is fixed
    // by Minecraft's library manifest, but its presence differs on Windows/Linux.
    ignoredDependencies.add('io.netty:netty-transport-native-epoll')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('processResources', ProcessResources) {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                    neo_version: neo_version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-${mod_version}+NeoForge${minecraft_version}.jar"
    // Development-only GameTests and templates stay out of the release mod.
    exclude 'dev/b2spirit/gametest/**'
    exclude 'data/b2spirit/structure/test_empty.nbt'
}

// Export the actual procedural mesh for modelling checks without launching Minecraft.
tasks.register('exportB2Model', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'dev.b2spirit.client.B2Mesh'
    args file('art/b2-spirit.obj').absolutePath
}
